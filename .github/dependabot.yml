version: 2
updates:
  - package-ecosystem: pip
    directory: /
    versioning-strategy: increase
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
