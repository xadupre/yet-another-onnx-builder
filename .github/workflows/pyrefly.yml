name: Pyrefly

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyrefly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytorch 2.14.1
        run: pip install torch==2.14.1+cpu torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - uses: ./.github/actions/install-onnx-light

      - name: Install dependencies
        run: pip install -e ".[category_encoders,imblearn,lightgbm,perpetual,polars,sklearn,sksurv,statsmodels,tensorflow,torch,transformers,xgboost]" pyrefly
      - name: Install mbext
        run: |
          pip install --no-deps git+https://github.com/xadupre/mbext.git
          python -c "import onnx_light; from packaging.version import Version; assert Version(onnx_light.__version__) >= Version('0.2.1')"
      - name: Run pyrefly
        run: pyrefly check
