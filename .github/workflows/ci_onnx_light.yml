name: ci-onnx-light

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native_backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/install-onnx-light
      - name: Install published wheels
        run: |
          python -m pip install --only-binary=:all: \
            numpy ml_dtypes scipy onnxruntime scikit-learn pytest pandas xlsxwriter optree
      - name: Install CPU Torch wheel
        run: |
          python -m pip install --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu "torch>=2.11"
      - name: Check native wheel provenance
        run: |
          python -c "import onnx_light; from pathlib import Path; assert 'site-packages' in Path(onnx_light.__file__).parts, onnx_light.__file__"
          python -c "import importlib.util; assert importlib.util.find_spec('onnx') is None"
      - name: Run native backend and dispatcher tests
        run: |
          python -m pytest -q \
            unittests/builder/onnxlight \
            unittests/main/test_to_onnx_light.py \
            unittests/main/test_onnx_shim.py \
            unittests/main/test_install_native_wheel.py \
            unittests/main/test_to_onnx.py \
            unittests/main/test_native_only.py \
            unittests/container \
            unittests/xshape \
            unittests/reference \
            unittests/torch/test_native_export.py \
            unittests/helpers/test_backend_test_pretty.py \
            unittests/sql/test_trace_numpy_to_onnx.py \
            unittests/sql/test_to_onnx_params.py
